<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de DOM</title>
    <script src="dom12-crud-productos.js" defer></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h2 {
        color: #333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    th {
        background-color: #f2f2f2;
    }
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    .formulario {
    background-color: aliceblue;
    border: 1px solid #d9f3f2;
    padding: 20px;
    margin-top: 20px;
    }

    .formulario input {
        padding: 8px;          
        width: 180px;          
        margin-right: 10px;    
        box-sizing: border-box;
    }

    .btn-agregar {
        padding: 8px 16px;      /* Tamaño adecuado para el botón */
        cursor: pointer;
    }

    .btn-agregar:hover {
        background-color: rgb(128, 221, 221);
        color: #f9f9f9;
    }
    .btn-cancelar:hover {
        background-color: bisque;
        color: #333;
    }
</style>
</head>
<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>CRUD de Productos</h2>
    <div class="formulario">
        <h3>Agregar Nuevo Producto</h3>
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" placeholder="Nombre del producto">
        <label for="descripcion">Descripción:</label>
        <input id="descripcion" type="text" placeholder="Descripcion del producto">
        <label for="precio">Precio:</label>
        <input id="precio" type="number" placeholder="Precio del producto">
        <button id="btn_agregar" class="btn-agregar">Agregar</button>
        <button id="btn_cancelar" class="btn_cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>
</body>
</html>
