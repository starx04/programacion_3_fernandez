<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Restaurante - CRUD de Platos</title>
    <script src="dom12-crud-productos_mp.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .formulario { background-color: #b03a2e; color: #fff; border: 4px solid #000; padding: 20px; margin-top: 20px; }
        .formulario input { padding: 8px; width: 180px; margin-right: 10px; box-sizing: border-box; }
        .btn-agregar { padding: 8px 16px; cursor: pointer; }
        .btn-agregar:hover { background-color: #05e2e2; color: #f9f9f9; }
        .stat-card { display: inline-block; width: 200px; padding: 15px; margin: 10px; background-color: #c30b0b; border-radius: 5px; color: #fff; text-align: center; }
    </style>
</head>
<body>
    <h1>Menu de Restaurante</h1>
    <h2>CRUD de Platos</h2>
    <div id="stats">
        <div class="stat-card"><h3>Total de Platos</h3><p id="totalPlatos">0</p></div>
        <div class="stat-card"><h3>Precio Promedio</h3><p id="precioPromedio">$0.00</p></div>
        <div class="stat-card"><h3>Precio Mas Caro</h3><p id="precioMasCaro">N/A</p></div>
        <div class="stat-card"><h3>Precio Mas Barato</h3><p id="precioMasBarato">N/A</p></div>
    </div>

    <div class="formulario">
        <h3>Agregar Nuevo Plato</h3>
        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" placeholder="Nombre del plato">
        <label for="descripcion">Descripcion:</label>
        <input id="descripcion" type="text" placeholder="Descripcion del plato">
        <label for="precio">Precio:</label>
        <input id="precio" type="number" placeholder="Precio del plato">
        <button id="btn_agregar" class="btn-agregar">Agregar</button>
        <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr><th>ID</th><th>Nombre</th><th>Descripcion</th><th>Precio</th><th>Acciones</th></tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>
</body>
</html>
