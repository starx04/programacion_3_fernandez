<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Restaurante - Ficha arrastrable</title>
    <script src="dom06-mouse-touch_mp.js" defer></script>
    <style>
        #container { position: relative; width: 100%; height: 300px; border: 1px dashed #999; }
        #ficha {
            position: absolute; top: 20px; left: 20px;
            width: 120px; height: 60px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; cursor: grab; background: #e67e22;
            user-select: none;
        }
    </style>
</head>
<body>
    <h1>Categorias del menu</h1>
    <p>Hace click y arrastra la ficha para moverla por categorias.</p>
    <div id="container">
        <div id="ficha">Entradas</div>
    </div>
</body>
</html>
